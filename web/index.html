function startRun(dry){
  var label = dry ? '试运行' : '立即发送';
  if(activeRun){
    toast('已有任务在运行，请等待完成', true); return;
  }
  if(!model || !model.targets || !model.targets.length){
    toast('当前账号「' + curAccountName() + '」还没有续火花好友，请先在「续火花好友」中添加再试', true);
    return;
  }
  if(!dry && (!state.validation || state.validation.status !== 'passed')){
    toast('当前账号待验证：请先点「试运行（不发送）」；通过后再正式发送', true);
    return;
  }
  activeRun = {status: 'starting'};
  updateRunButtons();
  var accountId = curId || 'default';
  toast((dry ? '试运行开始' : '已触发正式发送') + '：账号「' + curAccountName() + '」，打开浏览器校验登录并定位好友…');
  api('POST', '/api/run', {dry_run: dry, account: curId || 'default'}).then(function(j){
    activeRun = j;
    pollRun(j.id, dry, accountId);
  }).catch(function(e){
    activeRun = null;
    toast(e.message, true);
    refreshRunLock();
  });
}
function showFriendRunOutcome(friendName, task, result){
  var items = Array.isArray(result && result.results) ? result.results : [];
  var item = items.filter(function(value){ return value && value.target === friendName; })[0] || items[0] || {};
  var sent = Number(item.sent) || 0;
  var failed = task.status !== 'success' || item.status === 'failed';
  var skipped = !failed && !sent;
  var kind = failed ? 'failed' : (skipped ? 'skipped' : 'success');
  var title = failed ? '发送失败' : (skipped ? '本次未发送' : '发送成功');
  var icon = failed ? '!' : (skipped ? '–' : '✓');
  var note = failed ? (task.error || item.error || '运行未完成，请查看运行记录后重试')
    : sent ? ('已向「' + friendName + '」记录发送 ' + sent + ' 条内容；请在抖音客户端核对送达。')
    : item.status === 'duplicate' ? '当天相同内容已按防重复规则跳过，本次没有新增发送。'
    : '本次没有新增发送，请查看运行记录确认原因。';
  openModal(title,
    '<div class="run-outcome ' + kind + '"><div class="run-outcome-icon">' + icon + '</div><div><div class="run-outcome-title">' + esc(title) + ' · ' + esc(friendName) + '</div><div class="run-outcome-note">' + esc(note) + '</div><div class="run-outcome-meta">这是程序运行结果，不等于抖音客户端已送达。</div></div></div>',
    '<button class="btn btn-primary" onclick="closeModal()">知道了</button>');
}
function pollRun(id, dry, accountId, friendName){
  var timer = setInterval(function(){
    api('GET', '/api/run/status?id=' + id).then(function(j){
      if(j.status === 'running') return;
      clearInterval(timer);
      activeRun = null;
      if(j.status !== 'success'){
        var reason = j.error || ('退出码 ' + j.returncode + '，请查看运行记录');
        if(/登录状态.*失效/.test(reason)) reason += '；请在当前账号点「重新登录」，完成扫码后再试运行';
        if(!friendName) toast((dry ? '试运行' : '发送') + '失败：' + reason, true);
      }
      loadAll().then(function(){
        renderDashboard(); renderLogs();
        updateRunButtons();
        var result = (state.logs && state.logs.result) || {};
        if(friendName){
          showFriendRunOutcome(friendName, j, result);
        } else if(j.status === 'success'){
          var sent = (result.results || []).reduce(function(n, item){ return n + (Number(item.sent) || 0); }, 0);
          toast(dry ? '无发送试运行已通过，发送 0 条' : (friendName ? '「' + friendName + '」：' : '') + (sent
            ? '本次程序记录发送 ' + sent + ' 条；请在抖音客户端核对送达'
            : '本次新增发送 0 条；请查看该账号的防重复及运行记录'));
        }
      });
    }).catch(function(){
      clearInterval(timer);
      activeRun = null;
      toast('查询任务状态失败', true);
      loadAll();
    });
  }, 3000);
}
function pollTask(id, done){
  var timer = setInterval(function(){
    api('GET', '/api/run/status?id=' + id).then(function(j){
      if(j.status === 'running') return;
      clearInterval(timer);
      if(done) done(j);
    }).catch(function(){ clearInterval(timer); if(done) done(null); });
  }, 2000);
}

/* ---------- 运行记录 ---------- */
function renderLogs(){
  if(!state) return;
  var logs = state.logs;
  var runs = Array.isArray(logs.runs) ? logs.runs : [];
  document.getElementById('log-count').textContent = (runs.length || logs.total_entries) + ' 条记录';
  var el = document.getElementById('log-table');
  if(!runs.length && !logs.entries.length){
    el.innerHTML = '<div class="empty">暂无发送记录</div>';
  } else {
    var records = runs.length ? runs : logs.entries.map(function(entry){
      return {finished_at: entry.finished_at || entry.started_at, scope:'legacy', target:entry.target, status:entry.status, sent:0};
    });
    var rows = records.map(function(e){
      var t = (e.finished_at || e.started_at || '').replace('T', ' ').slice(0, 19) || (e.date || '—');
      var scope = e.scope || 'legacy';
      var detail = e.sent ? ('发送 ' + e.sent + ' 条') : (e.status === 'duplicate' ? '防重复跳过' : '未新增发送');
      return '<tr><td>' + esc(t) + '</td><td><span class="activity-scope ' + esc(scope) + '">' + esc(scopeLabel(scope)) + '</span></td><td>' + esc(e.target || '好友') + '</td><td>' + statusPill(e.status) + '<div class="sub">' + esc(detail) + '</div></td></tr>';
    }).join('');
    el.innerHTML = '<table><colgroup><col style="width:26%"><col style="width:21%"><col style="width:27%"><col style="width:26%"></colgroup><thead><tr><th>时间</th><th>发送方式</th><th>对象</th><th>结果</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  var result = logs.result || {};
  var items = Array.isArray(result.results) ? result.results : [];
  var sent = items.reduce(function(n, item){ return n + (Number(item.sent) || 0); }, 0);
  var failed = items.filter(function(item){ return item.status === 'failed'; }).length;
  var summary = !result.finished_at ? '还没有运行结果' : failed ? '最近一次运行有 ' + failed + ' 位好友处理失败'
    : result.dry_run ? '无发送试运行已完成，发送 0 条'
    : sent ? '程序记录发送 ' + sent + ' 条消息' : '本次未新增发送消息';
  if(result.finished_at && !result.dry_run && !failed && !sent && model.preventDuplicates && state.overview.today_status === '已发送'){
    summary = '本次新增发送 0 条；今天已有发送记录，防重复已开启';
  }
  document.getElementById('result-summary').innerHTML = esc(summary) + '<small>' +
    (result.finished_at ? '结束时间：' + esc(result.finished_at.replace('T', ' ').slice(0, 19)) + ' · 程序记录不等于客户端送达' : '可先在总览执行无发送试运行') + '</small>';
  document.getElementById('result-block').textContent = JSON.stringify(logs.result || {}, null, 2);
  var scheduleNotes = [];
  var scheduleNames = {normal_triggered:'任务已触发',normal_pending:'正常任务仍在运行或结果待核对',normal_finished:'正常任务完成',normal_failed:'正常任务失败',starting:'补跑已启动',sent:'程序记录发送',already_sent:'当天已有程序发送',result_unknown:'发送结果不明，需核对客户端',validation_failed:'验证未通过',login_failed:'登录失败',process_start_failed:'进程启动失败',process_failed:'程序运行失败',config_failed:'配置检查失败',journal_failed:'记录异常',no_send:'未记录发送',expired:'跨天停止'};
  if(logs.schedule_status && logs.schedule_status.at) scheduleNotes.push('正常定时：' + logs.schedule_status.at.replace('T',' ').slice(0,19) + ' · ' + (scheduleNames[logs.schedule_status.status] || logs.schedule_status.status) + ' · ' + (logs.schedule_status.detail || ''));
  if(logs.catchup_status && logs.catchup_status.at) scheduleNotes.push('错时补跑：' + logs.catchup_status.at.replace('T',' ').slice(0,19) + ' · ' + (scheduleNames[logs.catchup_status.status] || logs.catchup_status.status) + ' · ' + (logs.catchup_status.detail || ''));
  document.getElementById('log-tail').textContent = scheduleNotes.concat(logs.log_tail).join('\n') || '（暂无日志）';
}
document.getElementById('btn-refresh-logs').addEventListener('click', function(){
  api('GET', '/api/logs' + (curId ? ('?account=' + encodeURIComponent(curId)) : '')).then(function(j){
    state.logs = j;
    renderLogs();
    toast('已刷新');
  }).catch(function(e){ toast(e.message, true); });
});

/* 总览只在可见时轮询运行产物，供后台定时与单好友任务完成后即时刷新。 */
window.setInterval(function(){
  if(curView !== 'dashboard' || document.hidden) return;
  loadAll().catch(function(){});
}, 5000);

/* ---------- 通知设置 ---------- */
function renderNotify(){
  if(!state) return;
  var n = state.notify;
  var dingStatus = document.getElementById('ding-status');
  var webhookStatus = document.getElementById('webhook-status');
  dingStatus.textContent = n.dingtalk_enabled ? '已配置' : '未配置';
  webhookStatus.textContent = n.webhook_url_configured ? '已配置' : '未配置';
  dingStatus.classList.toggle('configured', !!n.dingtalk_enabled);
  webhookStatus.classList.toggle('configured', !!n.webhook_url_configured);
  document.getElementById('inp-ding-webhook').value = '';
  document.getElementById('inp-ding-secret').value = '';
  document.getElementById('inp-webhook-url').value = '';
  document.getElementById('inp-webhook-headers').value = '';
  document.getElementById('inp-webhook-template').value = '';
}
document.getElementById('btn-save-notify').addEventListener('click', function(){
  var payload = {
    dingtalk_webhook: document.getElementById('inp-ding-webhook').value.trim(),
    dingtalk_secret: document.getElementById('inp-ding-secret').value.trim(),
    webhook_url: document.getElementById('inp-webhook-url').value.trim(),
    webhook_headers: document.getElementById('inp-webhook-headers').value.trim(),
    webhook_template: document.getElementById('inp-webhook-template').value.trim()
  };
  api('PUT', '/api/notify', payload).then(function(j){
    state.notify = j.notify;
    renderNotify();
    toast('通知配置已保存到 .env');
  }).catch(function(e){ toast('保存失败：' + e.message, true); });
});

/* ---------- 启动 ---------- */
loadAll().catch(function(e){
  document.getElementById('server-status').textContent = '连接失败';
  document.getElementById('dash-cards').innerHTML = '<div class="banner banner-warn" style="grid-column:1/-1"><div>无法连接本地工作台。请双击“启动控制台.bat”，再刷新页面。</div></div>';
}).then(function(){
  var h = location.hash.replace('#','');
  goView(VIEWS.indexOf(h) > -1 ? h : 'dashboard');
});
</script>
